name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "mlops", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "qhse-air-bot"

jobs:
  lint:
    name: Linting (Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Flake8
        run: pip install flake8
      - name: Run Flake8
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  tests-and-security:
    name: Tests and Security
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: qhse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/qhse_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: qhse_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      RAG_EMBEDDING_PROVIDER: local
      WAQI_API_TOKEN: dummy_token
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio bandit safety
      - name: Security Check Bandit
        run: bandit -r src/
        continue-on-error: true
      - name: Security Check Safety
        run: safety check
        continue-on-error: true
      - name: Run test suite
        run: pytest tests/

  build-and-scan:
    name: Build and Scan Docker image
    needs: tests-and-security
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build image for scanning
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
        continue-on-error: true
      - name: Login to DockerHub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push multi-tag image
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-staging:
    name: Staging simulation with Docker Compose
    needs: build-and-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v3
      - name: Prepare .env for staging
        run: |
          echo "POSTGRES_DB=qhse_db" >> .env
          echo "POSTGRES_USER=qhse_user" >> .env
          echo "POSTGRES_PASSWORD=qhse_password" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "POSTGRES_HOST=postgres" >> .env
          echo "WAQI_API_TOKEN=dummy_token" >> .env
      - name: Start staging stack
        run: |
          timeout 600 docker compose -f docker-compose.yml up -d postgres api frontend || {
            echo "Docker compose up timed out"
            docker compose -f docker-compose.yml logs || true
            exit 1
          }
      - name: Wait for API to be ready
        run: |
          for i in {1..12}; do
            if curl -sSf http://localhost:8100/health > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Wait for frontend to be ready
        run: |
          for i in {1..12}; do
             if curl -sSf http://localhost:8501/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Tear down staging stack
        if: always()
        run: docker compose -f docker-compose.yml down

  deploy-production:
    name: Production simulation
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Simulate production deployment
        run: |
          echo "Simulated deployment to production with image tags:"
          echo "latest and ${GITHUB_SHA}"

  notify:
    name: Notify
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify team
        run: echo "Pipeline finished for ${GITHUB_REF} with status ${GITHUB_JOB}"
