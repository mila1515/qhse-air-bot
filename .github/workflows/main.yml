name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "doc" ]
  pull_request:
    branches: [ "main", "doc" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: qhse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx pytest-asyncio
        
    - name: Run Tests
      env:
        # Database Config (Matches services above)
        DATABASE_URL: postgresql://user:password@localhost:5432/qhse_db
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: qhse_db
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        
        # API Keys & Secrets
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
        AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
        # Force Local Embeddings (HuggingFace) for tests as Azure Embedding is not available yet
        RAG_EMBEDDING_PROVIDER: local
        WAQI_API_TOKEN: ${{ secrets.WAQI_API_TOKEN }}
        SECRET_KEY: "test_secret_key" # Dummy key for tests
      run: |
        pytest tests/
      
    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and Push API Image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile
        push: true
        tags: user/qhse-air-bot:latest
