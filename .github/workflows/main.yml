name: CI/CD Pipeline

# Trigger a new build to generate workflow graph
on:
  push:
    branches: [ "main", "doc" ]
  pull_request:
    branches: [ "main", "doc" ]

jobs:
  lint:
    name: Linting (Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Flake8
        run: pip install flake8
      - name: Run Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  tests-and-security:
    name: Tests & Security
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: qhse_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio bandit safety
      
      - name: Security Check - Bandit
        run: |
          bandit -r src/ -f custom --msg-template "{abspath}:{line}: {test_id}[bandit]: {msg}"
        continue-on-error: true
        
      - name: Security Check - Safety
        run: safety check
        continue-on-error: true

      - name: Run Tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://user:password@localhost:5432/qhse_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: qhse_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          RAG_EMBEDDING_PROVIDER: local
          WAQI_API_TOKEN: dummy_token
        run: |
          pytest tests/

  build-and-push:
    name: Build & Push
    needs: tests-and-security
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image: qhse-air-bot
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
        env:
           DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy Application
        run: echo "🚀 Deploying to Production Server..."

  notify:
    name: Notify
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Team
        run: echo "📢 Notification sent!"
