global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'qhse-api'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8000']  # Port 8000 pour l'API via Docker

  - job_name: 'pushgateway'
    scrape_interval: 5s
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
