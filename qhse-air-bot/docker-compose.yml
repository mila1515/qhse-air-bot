version: '3.8'

services:
  api:
    build: .
    container_name: qhse_api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=qhse_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  db:
    image: postgres:15-alpine
    container_name: qhse_db
    environment:
      - POSTGRES_DB=qhse_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
